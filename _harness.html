<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body{background:#0C0C0C;color:#F5F1EA;font-family:'Outfit',sans-serif;}
</style></head><body>
<div id="root"></div>
<script>window.JOXE_STAFF_MODE = true;</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script>
fetch("/admin.jsx").then(r=>r.text()).then(src=>{
  const out = Babel.transform(src + "\n;Object.assign(window,{EmpShell});", {presets:["react"]}).code;
  (0,eval)(out);
  const emp = {id:"e1", name:"Valentina", role:"Estilista"};
  const App = () => {
    const [view,setView] = React.useState("agenda");
    return React.createElement(window.EmpShell, {
      emp, onLogout:()=>console.log("logout"), activeView:view, onNav:setView
    }, React.createElement("div",{style:{padding:32}},"Vista: "+view));
  };
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  window.__ready = true;
});
</script>
</body></html>
